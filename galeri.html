<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeri Kegiatan - Kelas 5 SDN Cijember</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
    margin-top:25px;
}

.card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
    cursor:pointer;
}

.card h3{
    padding:15px 15px 5px;
    color:#1565c0;
    font-size:18px;
}

.card p{
    padding:0 15px 20px;
    color:#555;
    line-height:1.6;
}

/* =====================================================
   TAMPILAN VIDEO
===================================================== */

.video-preview{
    width:100%;
    height:260px;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

.video-preview iframe{
    width:100%;
    height:100%;
    border:none;
    pointer-events:none;
}

.video-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.25);
}

.video-play{
    width:70px;
    height:70px;
    border-radius:50%;
    background:rgba(255,255,255,.95);
    color:#1565c0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    padding-left:4px;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.video-label{
    position:absolute;
    left:12px;
    bottom:12px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
}

/* =====================================================
   LIGHTBOX FOTO
===================================================== */

.lightbox{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:90%;
    max-height:90%;
    border-radius:15px;
}

/* =====================================================
   MODAL VIDEO
===================================================== */

.video-modal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    z-index:10000;
    padding:20px;
}

.video-modal.active{
    display:flex;
}

.video-modal-box{
    width:100%;
    max-width:900px;
    background:#000;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.video-modal-box iframe{
    width:100%;
    height:500px;
    display:block;
    border:none;
}

.video-close{
    position:absolute;
    top:10px;
    right:10px;
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:25px;
    cursor:pointer;
    z-index:2;
}

.video-close:hover{
    background:rgba(0,0,0,.9);
}

.loading{
    text-align:center;
    font-size:18px;
    padding:40px;
    color:#666;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    .gallery{
        grid-template-columns:1fr;
        gap:18px;
    }

    .card img,
    .video-preview{
        height:230px;
    }

    .video-modal{
        padding:10px;
    }

    .video-modal-box iframe{
        height:250px;
    }

    .video-play{
        width:60px;
        height:60px;
        font-size:24px;
    }

}

</style>

</head>

<body>

<div class="content">

<div class="box">

<h1>📷 GALERI KEGIATAN KELAS 5</h1>

<p>
Dokumentasi kegiatan belajar siswa SDN Cijember Tahun Ajaran 2026/2027.
</p>


<div class="gallery" id="gallery">

<div class="loading">
⏳ Memuat dokumentasi...
</div>

</div>


<br>


<a href="index.html"
class="menu-card"
style="display:inline-block;text-decoration:none;padding:12px 20px;">

<i class="fa-solid fa-arrow-left"></i>

Kembali ke Beranda

</a>

</div>

</div>


<!-- =====================================================
     LIGHTBOX FOTO
===================================================== -->

<div class="lightbox"
id="lightbox"
onclick="tutup()">

<img id="gambarbesar">

</div>


<!-- =====================================================
     MODAL VIDEO
===================================================== -->

<div class="video-modal"
id="videoModal"
onclick="klikLuarVideo(event)">

<div class="video-modal-box">

<button
class="video-close"
onclick="tutupVideo()">

×
</button>

<iframe
id="videoFrame"
src=""
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>

</div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbwhs1u7hnFJu646XR29ikxJ3GRV6s_Tqr64ijyCB4DcDSJpA-6SrTVEKYD9RTJ9KprmAQ/exec";


/* =========================================================
   AMBIL DATA GALERI
========================================================= */

fetch(API)

.then(res => res.json())

.then(data => {

    let html = "";


    if(data.length === 0){

        html =
        "<div class='loading'>Belum ada foto.</div>";

    }


    else{

        data.forEach(foto => {

            /*
             * Mendapatkan URL file dari Google Drive
             */
            const url = foto.foto || "";


            /*
             * Nama file
             */
            const namaFile =
                foto.nama || "Dokumentasi Kelas 5";


            /*
             * Cek apakah file merupakan video
             */
            const adalahVideo =
                cekVideo(url, namaFile);


            /*
             * Jika VIDEO
             */
            if(adalahVideo){

                const idVideo =
                    ambilIdDrive(url);


                if(idVideo){

                    html += `

                    <div class="card">

                        <div
                            class="video-preview"
                            onclick="bukaVideo('${idVideo}')">

                            <iframe
                                src="https://drive.google.com/file/d/${idVideo}/preview"
                                loading="lazy">
                            </iframe>

                            <div class="video-overlay">

                                <div class="video-play">

                                    <i class="fa-solid fa-play"></i>

                                </div>

                            </div>

                            <div class="video-label">

                                <i class="fa-solid fa-video"></i>

                                VIDEO

                            </div>

                        </div>


                        <h3>
                            ${namaFile}
                        </h3>


                        <p>
                            Dokumentasi video kegiatan
                            Kelas 5 SDN Cijember.
                        </p>

                    </div>

                    `;

                }

                else{

                    /*
                     * Jika video tetapi ID tidak ditemukan
                     */
                    html += `

                    <div class="card">

                        <div class="video-preview">

                            <div class="video-play">

                                <i class="fa-solid fa-video"></i>

                            </div>

                        </div>

                        <h3>
                            ${namaFile}
                        </h3>

                        <p>
                            Link video tidak dapat dibaca.
                        </p>

                    </div>

                    `;

                }

            }


            /*
             * Jika FOTO
             */
            else{

                html += `

                <div class="card">

                    <img
                        src="${url}"
                        onclick="lihat('${url}')"
                        loading="lazy">


                    <h3>
                        ${namaFile}
                    </h3>


                    <p>
                        Dokumentasi kegiatan
                        Kelas 5 SDN Cijember.
                    </p>

                </div>

                `;

            }

        });

    }


    document.getElementById("gallery").innerHTML = html;

})


.catch(error => {

    document.getElementById("gallery").innerHTML =

    "<div class='loading'>" +
    "❌ Gagal mengambil data dari Google Drive." +
    "</div>";

    console.log(error);

});


/* =========================================================
   CEK VIDEO
========================================================= */

function cekVideo(url, nama){

    const teks =
        (url + " " + nama).toLowerCase();


    return (

        teks.includes(".mp4") ||

        teks.includes(".mov") ||

        teks.includes(".avi") ||

        teks.includes(".mkv") ||

        teks.includes(".webm") ||

        teks.includes("video")

    );

}


/* =========================================================
   AMBIL ID FILE GOOGLE DRIVE
========================================================= */

function ambilIdDrive(url){

    if(!url) return null;


    /*
     * Format:
     * drive.google.com/file/d/ID/view
     */

    let hasil =
        url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);


    if(hasil){

        return hasil[1];

    }


    /*
     * Format:
     * drive.google.com/open?id=ID
     */

    hasil =
        url.match(/[?&]id=([a-zA-Z0-9_-]+)/);


    if(hasil){

        return hasil[1];

    }


    /*
     * Jika URL hanya berisi ID
     */

    if(
        /^[a-zA-Z0-9_-]{20,}$/.test(url)
    ){

        return url;

    }


    return null;

}


/* =========================================================
   LIHAT FOTO
========================================================= */

function lihat(src){

    document.getElementById(
        "gambarbesar"
    ).src = src;


    document.getElementById(
        "lightbox"
    ).style.display = "flex";

}


/* =========================================================
   TUTUP FOTO
========================================================= */

function tutup(){

    document.getElementById(
        "lightbox"
    ).style.display = "none";

}


/* =========================================================
   BUKA VIDEO
========================================================= */

function bukaVideo(id){

    const modal =
        document.getElementById("videoModal");


    const frame =
        document.getElementById("videoFrame");


    /*
     * Gunakan /preview agar Google Drive
     * menampilkan pemutar video.
     */

    frame.src =
        "https://drive.google.com/file/d/" +
        id +
        "/preview";


    modal.classList.add("active");

}


/* =========================================================
   TUTUP VIDEO
========================================================= */

function tutupVideo(){

    const modal =
        document.getElementById("videoModal");


    const frame =
        document.getElementById("videoFrame");


    /*
     * Kosongkan iframe agar video berhenti
     */

    frame.src = "";


    modal.classList.remove("active");

}


/* =========================================================
   KLIK DI LUAR VIDEO
========================================================= */

function klikLuarVideo(event){

    if(
        event.target ===
        document.getElementById("videoModal")
    ){

        tutupVideo();

    }

}


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            tutup();

            tutupVideo();

        }

    }
);

</script>
