<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f5f9;
    margin:0;
    padding:30px;
}

.box{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h1{
    color:#1565c0;
}

.pengumuman{
    background:#e3f2fd;
    padding:15px;
    border-left:6px solid #1565c0;
    margin:15px 0;
    border-radius:10px;
}

.tanggal{
    color:gray;
    font-size:14px;
}
</style>

</head>

<body>

<div class="box">

<h1>📢 Pengumuman Kelas 5</h1>

<div class="pengumuman">
<div class="tanggal">15 Juli 2026</div>

<h3>5 Hari Kedepan </h3>

<p>Seluruh siswa Kelas 5 seluruh siswa kelas 5 akan melaksanakan kegiatan MPLS.</p>

</div>

<div class="pengumuman">

<div class="tanggal">15 Juli 2026</div>

<h3>Tugas Matematika</h3>

<p>Kumpulkan tugas halaman 25 nomor 1-10 pada hari Jumat.</p>

</div>

</div>

</body>
</html>
