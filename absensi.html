<script>

if(role=="guru"){

    document.getElementById("menuBeranda").href="index.html";

    document.getElementById("namaLogin").innerHTML=
    "👨‍🏫 "+localStorage.getItem("namaGuru");

}else{

    document.getElementById("menuBeranda").href="dashboard-siswa.html";

    document.getElementById("judulHalaman").innerHTML=
    "📅 Absensi Saya";

    document.getElementById("judulAbsensi").innerHTML=
    "Absensi Saya";

    document.getElementById("menuData").style.display="none";

    document.getElementById("namaLogin").innerHTML=
    "👨‍🎓 "+localStorage.getItem("namaSiswa");

}

function logout(){

    if(confirm("Yakin ingin logout?")){

        localStorage.clear();

        window.location.href="login.html";

    }

}
