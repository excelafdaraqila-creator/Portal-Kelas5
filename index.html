<script>

/* =====================================================
   ROLE LOGIN
===================================================== */

const role =
(
    localStorage.getItem("role")
    || ""
)
.trim()
.toLowerCase();



/* =====================================================
   AMBIL ELEMEN
===================================================== */

const namaPengguna =
document.getElementById(
    "namaGuru"
);


const judulPengguna =
document.getElementById(
    "judulPengguna"
);


const menuRekapAbsensi =
document.getElementById(
    "menuRekapAbsensi"
);


const menuPerkembangan =
document.getElementById(
    "menuPerkembangan"
);



/* =====================================================
   DATA LOGIN SISWA
===================================================== */

const namaSiswa =
localStorage.getItem(
    "namaSiswa"
)
|| "";


const nisnSiswa =
localStorage.getItem(
    "nisn"
)
|| "";



/* =====================================================
   DATA LOGIN GURU
===================================================== */

const namaGuru =
localStorage.getItem(
    "namaGuru"
)
|| "Gr. Asep Jamhur, S.Pd., M.M.";



/* =====================================================
   MODE GURU
===================================================== */

if(role === "guru"){

    /* ---------------------------------------------
       NAMA GURU
    --------------------------------------------- */

    namaPengguna.textContent =
        namaGuru;


    judulPengguna.textContent =
        namaGuru;


    /* ---------------------------------------------
       REKAP ABSENSI TAMPIL
    --------------------------------------------- */

    if(menuRekapAbsensi){

        menuRekapAbsensi.style.display =
            "flex";

    }


    /* ---------------------------------------------
       PERKEMBANGAN TAMPIL
    --------------------------------------------- */

    if(menuPerkembangan){

        menuPerkembangan.style.display =
            "flex";


        menuPerkembangan.classList.add(
            "guru"
        );

    }

}



/* =====================================================
   MODE SISWA
===================================================== */

else if(
    role === "siswa"
    ||
    role === "student"
    ||
    role === "murid"
){

    /* ---------------------------------------------
       NAMA SISWA
    --------------------------------------------- */

    const namaTampil =
        namaSiswa
        ||
        "Siswa";


    namaPengguna.textContent =
        namaTampil;


    judulPengguna.textContent =
        "👨‍🎓 " +
        namaTampil;



    /* ---------------------------------------------
       REKAP ABSENSI DISEMBUNYIKAN
    --------------------------------------------- */

    if(menuRekapAbsensi){

        menuRekapAbsensi.style.display =
            "none";

    }



    /* ---------------------------------------------
       PERKEMBANGAN SISWA TETAP TAMPIL
    --------------------------------------------- */

    if(menuPerkembangan){

        menuPerkembangan.style.display =
            "flex";

    }



    /*
       Simpan NISN untuk digunakan
       perkembangan.html

       perkembangan.js akan membaca:

       localStorage.getItem("nisn")

       kemudian otomatis mengambil
       data perkembangan berdasarkan NISN.
    */

    if(nisnSiswa){

        localStorage.setItem(
            "nisn",
            nisnSiswa
        );

    }

}



/* =====================================================
   ROLE TIDAK DIKENAL
===================================================== */

else{

    /*
       Jika role tidak dikenali,
       jangan tampilkan menu khusus guru.
    */

    if(menuRekapAbsensi){

        menuRekapAbsensi.style.display =
            "none";

    }


    if(menuPerkembangan){

        menuPerkembangan.style.display =
            "none";

    }


    judulPengguna.textContent =
        "Pengguna";

}



/* =====================================================
   PENCARIAN MENU
===================================================== */

const searchBox =
document.querySelector(
    ".search-box"
);


if(searchBox){

    searchBox.addEventListener(
        "input",
        function(){

            const keyword =
                this.value
                .toLowerCase()
                .trim();


            const menus =
                document.querySelectorAll(
                    ".menu-item"
                );


            menus.forEach(
                function(menu){

                    const text =
                        menu.textContent
                        .toLowerCase();


                    /*
                       MENU REKAP ABSENSI
                       TETAP KHUSUS GURU
                    */

                    if(
                        menu.id ===
                        "menuRekapAbsensi"
                    ){

                        if(
                            role !== "guru"
                        ){

                            menu.style.display =
                                "none";

                            return;

                        }

                    }


                    /*
                       MENU PERKEMBANGAN
                       BOLEH DILIHAT GURU
                       DAN SISWA
                    */

                    if(
                        menu.id ===
                        "menuPerkembangan"
                    ){

                        if(
                            role !== "guru"
                            &&
                            role !== "siswa"
                            &&
                            role !== "student"
                            &&
                            role !== "murid"
                        ){

                            menu.style.display =
                                "none";

                            return;

                        }

                    }


                    /*
                       FILTER PENCARIAN
                    */

                    if(
                        keyword === ""
                        ||
                        text.includes(keyword)
                    ){

                        menu.style.display =
                            "flex";

                    }

                    else{

                        menu.style.display =
                            "none";

                    }

                }
            );

        }
    );

}

);
