<script>

/* =====================================================
   ROLE LOGIN
===================================================== */

const role =
localStorage.getItem("role");


/* =====================================================
   NAMA PENGGUNA
===================================================== */

const namaPengguna =
document.getElementById("namaGuru");


/* =====================================================
   GURU
===================================================== */

if(role === "guru"){

    namaPengguna.textContent =
        localStorage.getItem("namaGuru")
        || "Gr. Asep Jamhur, S.Pd., M.M.";


    /* ---------------------------------------------
       TAMPILKAN REKAP ABSENSI
    --------------------------------------------- */

    const menuRekap =
        document.getElementById("menuRekapAbsensi");


    if(menuRekap){

        menuRekap.style.display = "flex";

    }

}


/* =====================================================
   SISWA
===================================================== */

else if(role === "siswa"){

    namaPengguna.textContent =
        localStorage.getItem("namaSiswa")
        || "Siswa";


    /* ---------------------------------------------
       PASTIKAN REKAP ABSENSI TERSEMBUNYI
    --------------------------------------------- */

    const menuRekap =
        document.getElementById("menuRekapAbsensi");


    if(menuRekap){

        menuRekap.style.display = "none";

    }

}


/* =====================================================
   ROLE TIDAK DIKENAL
===================================================== */

else{

    namaPengguna.textContent =
        "Pengguna";

}



/* =====================================================
   JAM
===================================================== */

function updateJam(){

    const d = new Date();

    const jam =
        document.getElementById("jam");


    if(jam){

        jam.textContent =
            d.toLocaleTimeString("id-ID");

    }

}


updateJam();

setInterval(updateJam,1000);



/* =====================================================
   PENCARIAN MENU
===================================================== */

const searchBox =
document.querySelector(".search-box");


if(searchBox){

    searchBox.addEventListener(
        "input",
        function(){

            const keyword =
                this.value
                .toLowerCase()
                .trim();


            const menus =
                document.querySelectorAll(
                    ".menu-item"
                );


            menus.forEach(function(menu){

                const text =
                    menu.textContent
                    .toLowerCase();


                if(
                    keyword === ""
                    ||
                    text.includes(keyword)
                ){

                    /* --------------------------------
                       REKAP TETAP KHUSUS GURU
                    -------------------------------- */

                    if(
                        menu.id ===
                        "menuRekapAbsensi"
                        &&
                        role !== "guru"
                    ){

                        menu.style.display =
                            "none";

                    }

                    else{

                        menu.style.display =
                            "flex";

                    }

                }

                else{

                    menu.style.display =
                        "none";

                }

            });

        }
    );

}

</script>
