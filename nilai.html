<script>
const role = localStorage.getItem("role");
// ========================
// MENU LOGIN
// ========================

if(role=="guru"){

document.getElementById("menuBeranda").href="index.html";

document.getElementById("namaLogin").innerHTML=
"👨‍🏫 "+localStorage.getItem("namaGuru");

}else{

document.getElementById("menuBeranda").href="dashboard-siswa.html";

document.getElementById("judulMenu").innerHTML="Nilai Saya";

document.getElementById("judulAbsensi").innerHTML="Absensi Saya";

document.getElementById("menuData").style.display="none";

document.getElementById("judulHalaman").innerHTML="📊 Nilai Saya";

document.getElementById("namaLogin").innerHTML=
"👨‍🎓 "+localStorage.getItem("namaSiswa");

// siswa tidak perlu pencarian
document.getElementById("cari").style.display="none";

}

// ========================
// LOGOUT
// ========================

function logout(){

if(confirm("Yakin ingin logout?")){

localStorage.clear();

window.location.href="login.html";

}

}

</script>
